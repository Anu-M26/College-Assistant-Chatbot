<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Facilities - {{ college.college_name }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f8fafc);
            color: #1e293b;
        }

        .page-header {
            background: linear-gradient(135deg, #064e3b, #047857, #10b981);
            color: white;
            padding: 32px 8%;
            box-shadow: 0 5px 20px rgba(4,120,87,0.25);
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .page-header p {
            color: #d1fae5;
            margin-top: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 11px 20px;
            background: white;
            color: #047857;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
            border: 1px solid #bbf7d0;
            box-shadow: 0 4px 12px rgba(4,120,87,0.08);
            transition: 0.3s;
        }

        .back-button:hover {
            background: #047857;
            color: white;
            transform: translateY(-2px);
        }

        .facility-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .facility-card {
            background: white;
            padding: 24px;
            border-radius: 15px;
            border: 1px solid #dcfce7;
            box-shadow: 0 8px 22px rgba(15,23,42,0.07);
            font-size: 17px;
            font-weight: 600;
            color: #334155;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .facility-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: #10b981;
        }

        .facility-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 13px 28px rgba(4,120,87,0.14);
            color: #065f46;
        }

    </style>

</head>

<body>

<header class="page-header">

    <h1>
        Campus Facilities
    </h1>

    <p>
        {{ college.college_name }}
    </p>

</header>

<div class="container">

    <a href="/" class="back-button">
        ← Back to Home
    </a>

    <div class="facility-list">

        {% for facility in college.campus_facilities %}

        <div class="facility-card">

            {{ facility }}

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
