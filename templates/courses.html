<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Courses - {{ college.college_name }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            color: #1e293b;
        }

        .page-header {
            background: linear-gradient(135deg, #172554, #1d4ed8, #2563eb);
            color: white;
            padding: 32px 8%;
            box-shadow: 0 5px 20px rgba(30, 64, 175, 0.25);
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #dbeafe;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 11px 20px;
            background: white;
            color: #1d4ed8;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
            border: 1px solid #dbeafe;
            box-shadow: 0 4px 12px rgba(30,64,175,0.08);
            transition: 0.3s ease;
        }

        .back-button:hover {
            background: #1d4ed8;
            color: white;
            transform: translateY(-2px);
        }

        .department-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .department-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 25px rgba(15,23,42,0.08);
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .department-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
        }

        .department-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(30,64,175,0.15);
        }

        .department-card h2 {
            margin-top: 0;
            color: #172554;
        }

        .head {
            color: #64748b;
            margin-bottom: 20px;
        }

        .department-card h3 {
            color: #2563eb;
        }

        .course-list {
            padding-left: 20px;
        }

        .course-list li {
            margin: 10px 0;
            color: #334155;
        }

        .course-list li::marker {
            color: #2563eb;
        }

    </style>

</head>

<body>

<header class="page-header">

    <h1>
        Courses & Departments
    </h1>

    <p>
        {{ college.college_name }}
    </p>

</header>

<div class="container">

    <a href="/" class="back-button">
        ← Back to Home
    </a>

    <div class="department-grid">

        {% for department in college.departments %}

        <div class="department-card">

            <h2>
                {{ department.name }}
            </h2>

            <p class="head">
                Head: {{ department.head }}
            </p>

            <h3>
                Available Courses
            </h3>

            <ul class="course-list">

                {% for course in department.courses %}

                <li>
                    {{ course }}
                </li>

                {% endfor %}

            </ul>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
